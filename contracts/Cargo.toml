[workspace]
resolver = "2"
members = ["levee", "mock-signer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "=5.30.1"

# NEAR charges for every wasm instruction and every byte of code, so favour
# size. Overflow checks stay on: a silent wrap in a budget is never acceptable.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
